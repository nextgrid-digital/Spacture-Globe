<script>
class DCLogic {}
class Component extends DCLogic {
  renderVals() { return {}; }
  componentWillUnmount() { this.dead = true; cancelAnimationFrame(this.raf); }
  componentDidMount() {
    const self = this;
    const start = () => {
      const cv = document.getElementById('globe'); const tagsEl = document.getElementById('tags');
      const im = document.getElementById('albtex'), tp = document.getElementById('topotex');
      if (!cv || !tagsEl || !im || !im.complete || !im.naturalWidth || !tp || !tp.complete || !tp.naturalWidth) { self.raf = requestAnimationFrame(start); return; }
      self.run(cv, tagsEl);
    };
    start();
  }
  run(cv, tagsEl) {
    const D = Math.PI / 180;
    const ctx = cv.getContext('2d');
    const CX = 470, CY = 410, R = 330, LAT0 = 18;

    // ---- Earth surface (NASA Blue Marble, greyscale, detail-sharpened) ----
    const texImg = document.getElementById('albtex');
    const TW = texImg.naturalWidth, TH = texImg.naturalHeight, TN = TW * TH;
    const tc = document.createElement('canvas'); tc.width = TW; tc.height = TH; const tcx = tc.getContext('2d'); tcx.drawImage(texImg, 0, 0);
    const TD = tcx.getImageData(0, 0, TW, TH).data; const AL = new Float32Array(TN); for (let i = 0; i < TN; i++) AL[i] = TD[i * 4] / 140;
    // terrain relief from the Earth elevation map, sampled up to texture size
    const topoImg = document.getElementById('topotex'); const pc = document.createElement('canvas'); pc.width = TW; pc.height = TH; const pcx = pc.getContext('2d');
    pcx.drawImage(topoImg, 0, 0, TW, TH); const PD = pcx.getImageData(0, 0, TW, TH).data;
    const GX = new Float32Array(TN), GY = new Float32Array(TN);
    for (let ty = 0; ty < TH; ty++) { const cl = Math.max(0.2, Math.cos((90 - (ty + 0.5) / TH * 180) * Math.PI / 180));
      for (let tx = 0; tx < TW; tx++) { const i = ty * TW + tx, xl = ty * TW + (tx + TW - 1) % TW, xr = ty * TW + (tx + 1) % TW, yu = Math.max(0, ty - 1) * TW + tx, yd = Math.min(TH - 1, ty + 1) * TW + tx;

      { const L = labeled.length;
        const boxOf = (i, isA) => { const p = labeled[i].p; return isA ? [p[0] + 20, p[1] - 80, p[0] + 256, p[1] - 4] : [p[0] + 6, p[1] - 64, p[0] + 192, p[1] - 10]; };
